name: cekmece_detector
description: "Cekmece icindeki nesneleri YOLOv8 ile real-time tespit eden mobil uygulama."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ML / Inference
  tflite_flutter: ^0.12.0

  # Camera
  camera: ^0.11.0+2

  # Permissions
  permission_handler: ^11.3.1

  # On-device latency/thermal logging (K4) — writes CSV to app external dir
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Active: native fp32 — each size is the model TRAINED at that resolution
    # (cekmece_v4_141epoch_{N}imgsz), not the 800-model downscaled. Native wins
    # clearly at 320 and ties at 512/640 — see PERFORMANCE.md "Native-çözünürlük
    # eğitimi vs 800px-downscale". fp16 exports were broken (float16 I/O) and the
    # 800-downscaled fp32 stay on disk for the thesis A/B but are not bundled.
    - assets/models/cekmece_v4_native320_fp32.tflite
    - assets/models/cekmece_v4_native512_fp32.tflite
    - assets/models/cekmece_v4_native640_fp32.tflite
    - assets/models/cekmece_v4_native800_fp32.tflite
    # YOLOv8s @320 ablation model (on-device FPS comparison vs YOLOv8n)
    - assets/models/cekmece_v8s320_fp32.tflite
    - assets/models/labels.txt
